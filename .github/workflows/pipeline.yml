name: Operation Next Pipeline
on:
  schedule:
    - cron: "0 5 * * 3,5"   # Wednesday and Friday 07:00 CET
  push:
    # branches is required: GitHub ignores paths filters for tag pushes, so
    # without it every `git push origin vX.Y.Z` ran the whole pipeline — and
    # failed at the commit step, because a tag checkout is a detached HEAD.
    branches:
      - main
    paths:
      - "jobsearch/skill/SKILL.md"
      - "jobsearch/skill/URL_VALIDATION_SKILL.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python pipeline/search.py
      - run: python pipeline/updater.py
      - run: python pipeline/mailer.py
      - name: Commit updated joblist
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Stage the whole directory, not just joblist.md. The pipeline also
          # writes jobsearch/requirements.json, and leaving it unstaged made
          # `git pull --rebase` refuse ("You have unstaged changes") after the
          # commit had already succeeded, so a run that found 12 new roles threw
          # all of them away. Matches what the app itself stages.
          git add jobsearch/
          git diff --staged --quiet || git commit -m "Auto-update joblist $(date +%Y-%m-%d)"
          # --autostash so the next file someone adds cannot break this again.
          git pull --rebase --autostash
          git push
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
